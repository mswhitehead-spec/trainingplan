name: training-cron

# All times in UTC. Copenhagen is CEST (UTC+2) in May/June 2026:
#   03:00 UTC = 05:00 CEST  — morning routine (sync + propose + email)
#   07:00 UTC = 09:00 CEST  — sync + propose
#   11:00 UTC = 13:00 CEST  — sync + propose
#   15:00 UTC = 17:00 CEST  — sync + propose
#   19:00 UTC = 21:00 CEST  — sync + propose
#
# NOTE: GitHub Actions cron can be delayed 5-20 min under load. That's fine
# for training-plan use; the email at 05:00 is the most schedule-sensitive
# but a 10-min slip doesn't break anything.

on:
  schedule:
    - cron: '0 3 * * *'    # 05:00 CEST — morning, with email
    - cron: '0 7 * * *'    # 09:00 CEST
    - cron: '0 11 * * *'   # 13:00 CEST
    - cron: '0 15 * * *'   # 17:00 CEST
    - cron: '0 19 * * *'   # 21:00 CEST
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Also send the daily email'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - '.github/workflows/training-cron.yml'
      - 'scripts/**'
      - 'src/**'

# Allow the job to commit state changes back.
permissions:
  contents: write

# Don't run two crons at the same time (one finishing might race with another
# starting); pile-up in this small a workload is unlikely but the lock is cheap.
concurrency:
  group: training-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Use cloud config
        run: cp config.cloud.yaml config.yaml

      - name: Sync Strava → match → analyze
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: python scripts/sync.py --quiet

      - name: Generate proposal
        # propose.py is offline (no Strava needed; reads plan.yaml only).
        run: python scripts/propose.py

      - name: Auto-apply proposal
        # Accepts every proposed change without prompting.
        # adapt.py filters out changes already applied to a session (same
        # rule_id + field_path), so the same rule never fires twice on the
        # same session target. No-op if there are no pending changes.
        run: python scripts/apply_proposal.py --yes

      - name: Regenerate plan.ics
        run: python scripts/publish_calendar.py

      - name: Send daily email
        # Runs on every cron slot. send_daily_email.py checks state.json and
        # skips silently if today's email was already sent — so whichever slot
        # fires first delivers the email (ideally 05:00 CEST, but any slot works
        # if GitHub skips the early-morning run).
        # workflow_dispatch with send_email=true bypasses the guard via --force.
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          if [ "${{ github.event.inputs.send_email }}" = "true" ]; then
            python scripts/send_daily_email.py --force
          else
            python scripts/send_daily_email.py
          fi

      - name: Commit state changes
        run: |
          # Drop the config.yaml we copied in — it was a runtime convenience,
          # not state. Keeps the working tree clean.
          rm -f config.yaml

          git config user.name  "training-cron"
          git config user.email "training-cron@users.noreply.github.com"
          git add artifacts-local/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            STAMP=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            git commit -m "cron: ${STAMP}"
            # Retry once on push failure: another run may have pushed between
            # our checkout and now. Pull-rebase brings us current, then push.
            git push || (git pull --rebase && git push)
          fi
