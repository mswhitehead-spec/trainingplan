  notes: "*** RACE *** Half marathon — 21.1 km.\n\nA-goal 1:52 (5:18/km). B-goal 1:56 (5:30/km). Stretch:\
    \ PR pace 5:12 (1:49:42) only if the Sep 1 checkpoint was green.\n\nThis target is set off what the\
    \ last four months actually contained, not off ambition: best 5 km split 26:00, two runs over 10 km\
    \ since April, a back injury in late July. 1:52 off that base is a real six-week gain.\n\nPacing\n\
    \  Km 1-3: 5:18, never faster. This is the failure mode — going out at a pace the training didn't\
    \ buy turns 1:52 into 2:05.\n  Km 4-15: lock in 5:15-5:22, HR 139-147. Rhythm over heroics.\n  Km\
    \ 16-21: race. Empty it in the last 3 km, not at 16.\n\nDecision gate (set after the Sep 1 checkpoint)\n\
    \  Green — 3x2 km at 5:15 felt controlled → race at 5:18, and if it felt genuinely easy consider 5:12\
