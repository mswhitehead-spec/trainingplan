- id: 2026-09-20_sun_half-marathon
  date: '2026-09-20'
  discipline: running
  type: race
  targets:
    duration_min: 100
    distance_km: 21.1
    avg_hr_range: *id003
    avg_pace_min_per_km: '4:44'
  notes: "*** RACE *** Half marathon — 21.1 km. Sub-1:40 target (4:44/km). Last year: 1:49 — this is the\
    \ A-goal; B-goal is sub-1:45 (4:58/km), still a 4-min PR.\n\nPacing\n  Km 1-3: 4:44, never faster.\
    \ Banked seconds cost minutes later.\n  Km 4-15: lock in 4:42-4:46, HR 144-154. Rhythm over heroics.\n\
    \  Km 16-21: race. Empty it in the last 3 km, not at 16.\n\nDecision gate (set after the Sep 1 checkpoint\
    \ session)\n  Green: 4x2km @ 4:40-4:44 felt controlled → race at 4:44.\n  Amber: it was a fight →\
    \ race at 4:58 and negative-split.\n\nFueling\n  Breakfast 2.5-3 h out, familiar carbs.\n  1 gel ~15\
    \ min before start, 1 gel around km 10-12.\n  Water at stations — a few sips each, don't skip.\n\n\
    If the day goes sideways\n  HR > 156 in the first 5 km → ease off 10 s/km immediately.\n  Side stitch\
    \ → exhale hard on the opposite foot strike, shorten stride until it clears."
  status: planned
  actual: null
  analysis: null
  adaptations: []
  time_of_day: morning
