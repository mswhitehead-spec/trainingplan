    \ race at 4:58 and negative-split.\n\nFueling\n  Breakfast 2.5-3 h out, familiar carbs.\n  1 gel ~15\
    \ min before start, 1 gel around km 10-12.\n  Water at stations — a few sips each, don't skip.\n\n\
    If the day goes sideways\n  HR > 156 in the first 5 km → ease off 10 s/km immediately.\n  Side stitch\
    \ → exhale hard on the opposite foot strike, shorten stride until it clears."
