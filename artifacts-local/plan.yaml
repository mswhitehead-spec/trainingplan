    distance_km: 315
    avg_hr_zone: Z2
    avg_hr_range:
    - 116
    - 127
    avg_speed_kmh: 22.5
  notes: "*** RACE *** Vätternrundan — 315 km. Sub-14h target.\n\nPacing\n  First 100 km: low Z2 (121-127\
    \ HR). Resist the urge to go fast.\n  Middle 100 km: hold Z2; some drift to high Z2 is normal.\n \
    \ Last 100 km: hold whatever feels sustainable. Prioritize fuel.\n\nFueling\n  Carb: 70-80 g/h from\
    \ km 5. Real food + drink mix.\n  Fluids: 750 ml/h baseline; more if it's hot.\n  Caffeine: hold until\
    \ the last 100 km if possible.\n\nStops\n  Keep them short (5-10 min). Eat while moving where possible.\n\
    \  Don't sit down at controls — gets cold, hard to restart.\n\nBail criteria\n  HR > 133 for 15+ min\
    \ in first 100 km → slow immediately.\n  Can't keep food down → walk, sip, restart slow.\n  Mechanical\
    \ you can't fix → don't try to limp 200 km."
  status: missed
  actual: null
  analysis: null
  adaptations: []
