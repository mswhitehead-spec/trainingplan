    \ h out, familiar carbs.\n  1 gel ~15 min before start, 1 gel around km 10-12.\n  Water at stations\
    \ — a few sips each, don't skip.\n\nIf the day goes sideways\n  HR over 150 in the first 5 km → ease\
    \ off 10 s/km immediately.\n  Back tightens → shorten stride, lift cadence, don't fight it. A finished\
    \ 2:00 beats a walked 18 km."
