  philosophy: 'Rebuilt six weeks out after a Strava audit (Apr 7 - Aug 6) showed the block was written
    against a run base that never existed: 852 km cycling vs 265 km running, only two runs over 10 km
    since April, and a locked-up back costing 22-29 Jul. Best 5 km split of the window is 26:00, which
    projects ~1:57 — so sub-1:40 (4:44/km) was never reachable and the fastest single kilometre in four
    months was 4:56. New target 1:52 (5:18/km), B-goal 1:56, with last year''s 1:49:42 as a green-light
    stretch off the Sep 1 checkpoint. The six weeks are built around one thing: the long run, 9 -> 11
    -> 14 -> 16 -> 17, because that is the gap. Bike prescriptions mostly dropped (29% adherence vs 77%
    for running), easy pace slowed to 6:00-6:30 so easy days stop costing recovery, mobility restored
    after the back episode, and HR zones rebuilt from measured data — observed max is 154, not the 168
    the old table assumed.'
