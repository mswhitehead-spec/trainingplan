- id: 2026-09-20_sun_half-marathon
  date: '2026-09-20'
  discipline: running
  type: race
  targets:
    duration_min: 115
    distance_km: 21.1
    avg_hr_range: *id003
    avg_pace_min_per_km: '5:27'
  notes: "*** RACE *** Half marathon — 21.1 km. Sub-1:55 target (5:27/km).\n\nPacing\n  Km 1-3: AT goal\
    \ pace, not under it. It must feel easy.\n  Km 4-15: settle at 5:25-5:30, HR 138-148. Lock in.\n \
    \ Km 16-21: whatever is left. This is where the taper pays out.\n\nFueling\n  Breakfast 2.5-3 h out,\
    \ familiar carbs.\n  1 gel ~15 min before start, 1 gel around km 10-12.\n  Water at stations — a few\
    \ sips each, don't skip.\n\nIf the day goes sideways\n  HR > 150 in the first 5 km → ease off 10 s/km\
    \ immediately.\n  Side stitch → exhale hard on the opposite foot strike, shorten stride until it clears."
  status: planned
  actual: null
  analysis: null
  adaptations: []
  time_of_day: morning
